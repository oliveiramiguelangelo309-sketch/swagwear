
<!DOCTYPE html>
<html lang="pt-BR">
<a href="ia.html">IA Looks</a>
<head>
  <meta charset="UTF-8">
  <title>Entrar - SwagWear</title>

  <link rel="stylesheet" href="style.css">
  <!-- conecta o CSS -->
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <!-- barra do topo -->

    <h2>SWAGWEAR</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="entrar.html">Entrar</a>
    </nav>
  </header>

  <!-- ÁREA DE LOGIN -->
  <section class="cadastro">
    <!-- reaproveita a mesma área central do cadastro -->

    <div class="box">
      <!-- caixa do formulário -->

      <h2>Entrar</h2>
      <!-- título da página -->

      <p>Acesse sua conta SwagWear</p>
      <!-- subtítulo -->

      <form>
        <!-- formulário de login -->

        <input type="email" placeholder="Email" required>
        <!-- campo de email -->

        <input type="password" placeholder="Senha" required>
        <!-- campo de senha -->

        <button type="submit">Entrar</button>
        <!-- botão -->

      </form>

      <p class="login-link">
        Não tem conta? <a href="cadastro.html">Cadastrar</a>
      </p>
      <!-- link para cadastro -->
    </div>
  </section>

</body>
</html>

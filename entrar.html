
<!DOCTYPE html>
<html lang="pt-BR">
<a href="ia.html">IA Looks</a>
<head>
  <meta charset="UTF-8">
  <title>Entrar - SwagWear</title>

  <link rel="stylesheet" href="style.css">
  <!-- conecta o CSS -->
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <!-- barra do topo -->

    <h2>SWAGWEAR</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="entrar.html">Entrar</a>
    </nav>
  </header>

  <!-- ÁREA DE LOGIN -->
  <section class="cadastro">
    <!-- reaproveita a mesma área central do cadastro -->

    <div class="box">
      <!-- caixa do formulário -->

      <h2>Entrar</h2>
      <!-- título da página -->

      <p>Acesse sua conta SwagWear</p>
      <!-- subtítulo -->

      <form id="formLogin">
        <!-- formulário de login -->

        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
        <!-- campo de email -->

        <input id="senha" name="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
        <!-- campo de senha -->

        <button type="submit">Entrar</button>
        <!-- botão -->

      </form>

      <p class="login-link">
        Não tem conta? <a href="cadastro.html">Cadastrar</a>
      </p>
      <!-- link para cadastro -->
    </div>
  </section>

  <script>
    /* Pega o formulário de login que já existia na página. */
    const formLogin = document.getElementById("formLogin");

    /* Envia as credenciais ao backend quando o usuário clicar em Entrar. */
    formLogin.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      try {
        /* A comparação da senha acontece no backend, nunca dentro deste HTML. */
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, senha })
        });

        const resultado = await resposta.json();
        alert(resultado.mensagem);

        /* Nesta etapa o login é validado; sessões seguras serão implementadas depois. */
        if (resposta.ok) {
          /* Guarda somente o token de autenticação; a senha nunca é armazenada no navegador. */
          localStorage.setItem("swagwear_token", resultado.token);
          localStorage.setItem("swagwear_usuario", JSON.stringify(resultado.usuario));
          window.location.href = "index.html";
        }
      } catch (error) {
        /* Informa de forma simples quando o backend não puder ser alcançado. */
        alert("Não foi possível conectar ao servidor.");
      }
    });
  </script>

</body>
</html>

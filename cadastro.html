
<!DOCTYPE html>
<!-- informa ao navegador que o arquivo usa HTML5 -->

<html lang="pt-BR">
<!-- idioma do documento -->

<head>
  <meta charset="UTF-8">
  <!-- permite acentos -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ajuda na responsividade -->

  <title>Cadastro - SwagWear</title>
  <!-- nome da aba -->

  <link rel="stylesheet" href="style.css">
  <!-- conecta ao mesmo CSS usado no resto do site -->
</head>

<body>

  <header class="navbar">
    <!-- mesma navbar da home, para o usuário não se perder -->

    <h2>SWAGWEAR</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="#">Drops</a>
      <a href="cadastro.html">Conta</a>
    </nav>
  </header>

  <section class="cadastro">
    <!-- área principal da tela de cadastro -->

    <div class="box">
      <!-- caixa visual do formulário -->

      <h2>Crie sua conta</h2>
      <!-- título da caixa -->

      <p>Entre para a SwagWear</p>
      <!-- subtítulo -->

      <form>
        <!-- formulário de cadastro -->

        <input type="text" placeholder="Nome" required>
        <!-- campo de nome -->

        <input type="email" placeholder="Email" required>
        <!-- campo de email -->

        <input type="password" placeholder="Senha" required>
        <!-- campo de senha -->

        <input type="password" placeholder="Confirmar senha" required>
        <!-- campo para confirmar a senha -->

        <button type="submit">Cadastrar</button>
        <!-- botão de envio do formulário -->
      </form>

      <p class="login-link">
        Já tem conta? <a href="#">Entrar</a>
      </p>
      <!-- texto com link de login -->
    </div>
  </section>

</body>
</html>

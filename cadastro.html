
<!DOCTYPE html>
<!-- informa ao navegador que o arquivo usa HTML5 -->

<html lang="pt-BR">
<!-- idioma do documento -->

<head>
  <meta charset="UTF-8">
  <!-- permite acentos -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ajuda na responsividade -->

  <title>Cadastro - SwagWear</title>
  <!-- nome da aba -->

  <link rel="stylesheet" href="style.css">
  <!-- conecta ao mesmo CSS usado no resto do site -->
</head>

<body>

  <header class="navbar">
    <!-- mesma navbar da home, para o usuário não se perder -->

    <h2>SWAGWEAR</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="#">Drops</a>
      <a href="cadastro.html">Conta</a>
    </nav>
  </header>

  <section class="cadastro">
    <!-- área principal da tela de cadastro -->

    <div class="box">
      <!-- caixa visual do formulário -->

      <h2>Crie sua conta</h2>
      <!-- título da caixa -->

      <p>Entre para a SwagWear</p>
      <!-- subtítulo -->

      <form id="formCadastro">
        <!-- formulário de cadastro -->

        <input id="nome" name="nome" type="text" placeholder="Nome" autocomplete="name" required>
        <!-- campo de nome -->

        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
        <!-- campo de email --> 
        <!-- gravar o email senha e detalhes no banco de dados e na nuvem -->

        <input id="senha" name="senha" type="password" placeholder="Senha" autocomplete="new-password" minlength="6" required>
        <!-- campo de senha -->

        <input id="confirmarSenha" name="confirmarSenha" type="password" placeholder="Confirmar senha" autocomplete="new-password" minlength="6" required>
        <!-- campo para confirmar a senha -->

        <button type="submit">Cadastrar</button>
        <!-- botão de envio do formulário -->
      </form>

      <p class="login-link">
        Já tem conta? <a href="entrar.html">Entrar</a>
      </p>
      <!-- texto com link de login -->
    </div>
  </section>

  <script>
    /* Pega o formulário existente sem alterar o visual da página. */
    const formCadastro = document.getElementById("formCadastro");

    /* Intercepta o envio para mandar os dados ao backend sem recarregar a página. */
    formCadastro.addEventListener("submit", async function (event) {
      event.preventDefault();

      /* Lê os valores digitados nos campos. */
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;

      /* A confirmação existe somente no navegador e nunca precisa ser salva no banco. */
      if (senha !== confirmarSenha) {
        alert("As senhas não são iguais.");
        return;
      }

      try {
        /* Envia nome, email e senha em JSON para a rota de cadastro. */
        const resposta = await fetch("/api/cadastro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, email, senha })
        });

        const resultado = await resposta.json();
        alert(resultado.mensagem);

        /* Após o cadastro funcionar, leva o usuário para a página de login. */
        if (resposta.ok) {
          window.location.href = "entrar.html";
        }
      } catch (error) {
        /* Esta mensagem aparece quando o servidor está desligado ou inacessível. */
        alert("Não foi possível conectar ao servidor.");
      }
    });
  </script>

</body>
</html>

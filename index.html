<!DOCTYPE html>
<!-- diz ao navegador que este arquivo usa HTML5 -->

<html lang="pt-BR">
<!-- começa o documento HTML e define o idioma como português do Brasil -->

<head>
  <meta charset="UTF-8">
  <!-- permite acentos e caracteres especiais -->

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- faz o site se adaptar melhor a celular e tablet -->

  <title>SwagWear</title>
  <!-- nome que aparece na aba do navegador -->

  <link rel="stylesheet" href="style.css">
  <!-- conecta este HTML ao arquivo de estilos -->
</head>


<body>
  <!-- tudo que aparece visualmente no site fica dentro do body -->

  <header class="navbar">
    <!-- barra de navegação fixa no topo -->

    <h2>SWAGWEAR</h2>   
    <!-- nome da marca / logo em texto -->

    <nav>
      <!-- área dos links do menu -->

      <a href="index.html">Home</a>
      <!-- leva para a página inicial -->

      <a href="loja.html">Loja</a>
      <!-- leva para a página da loja -->

      <a href="#">Drops</a>
      <!-- link temporário; depois você pode trocar por uma página real -->

      <a href="cadastro.html">Conta</a>
      <!-- leva para a página de cadastro -->
    </nav>
  </header>

  <section class="hero">
    <!-- primeira seção grande do site, com imagem de fundo -->

    <h1>SWAGWEAR</h1>
    <!-- título principal da home -->

    <p>Vista sua atitude</p>
    <!-- subtítulo / frase da marca -->

    <a href="loja.html">
      <!-- link que leva para a loja -->
      <button>Explorar</button>
      <!-- botão principal da home -->
    </a>
  </section>




<section class="produtos-home">
  <!-- seção de vitrine da home -->

  <div class="titulo-linha">
    <!-- área do título + botões -->

    <div>
      <h2>Destaques da SwagWear</h2>
      <!-- título da seção -->

      <p>Peças selecionadas de todos os drops</p>
      <!-- subtítulo -->
    </div>

    <div class="botoes-carrossel">
      <!-- botões laterais -->

      <button class="seta" onclick="rolarEsquerda()">
        ←
      </button>
      <!-- botão que leva a vitrine para a esquerda -->

      <button class="seta" onclick="rolarDireita()">
        →
      </button>
      <!-- botão que leva a vitrine para a direita -->
    </div>
  </div>

  <div class="carrossel-wrapper">
    <!-- área visível do carrossel -->

    <div class="carrossel" id="carrosselProdutos"></div>
  </div>
</section>



<script>
  const carrossel = document.getElementById("carrosselProdutos");

  function animarScroll(distancia) {
    /* posição inicial */
    const inicio = carrossel.scrollLeft;

    /* tempo da animação */
    const duracao = 500; 
    /* quanto maior, mais suave */

    let startTime = null;

    function animacao(currentTime) {
      if (!startTime) startTime = currentTime;

      const tempoPassado = currentTime - startTime;

      /* progresso de 0 a 1 */
      const progresso = Math.min(tempoPassado / duracao, 1);

      /* efeito suave (ease-out) */
      const ease = 1 - Math.pow(1 - progresso, 3);

      carrossel.scrollLeft = inicio + distancia * ease;
      /* move com suavidade */

      if (tempoPassado < duracao) {
        requestAnimationFrame(animacao);
      }
    }

    requestAnimationFrame(animacao);
  }

  function rolarDireita() {
    animarScroll(350);
    /* vai pra direita */
  }

  function rolarEsquerda() {
    animarScroll(-350);
    /* volta pra esquerda */
  }

  const dropPorColecao = {
    'Urban Pulse': 'Drop 01',
    'Neon District': 'Drop 02',
    'Raw Minimal': 'Drop 03'
  };

  const idsDestaque = [1, 5, 9, 14, 17, 21];

  function formatarPrecoDestaque(valor) {
    return `R$ ${Number(valor || 0).toLocaleString("pt-BR")}`;
  }

  function criarCardDestaque(produto) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="" alt="">
      <div class="info">
        <span class="categoria"></span>
        <h3></h3>
        <p></p>
        <a class="btn-card" href="produto.html?produto=${encodeURIComponent(produto.id)}">Ver mais</a>
      </div>`;

    const imagem = card.querySelector("img");
    imagem.src = produto.imagem || "";
    imagem.alt = produto.nome || "Produto SwagWear";
    card.querySelector(".categoria").textContent = dropPorColecao[produto.colecao] || produto.colecao || "";
    card.querySelector("h3").textContent = produto.nome;
    card.querySelector(".info p").textContent = formatarPrecoDestaque(produto.preco);
    return card;
  }

  async function carregarDestaques() {
    try {
      const resposta = await fetch("/api/produtos");
      if (!resposta.ok) throw new Error("Não foi possível carregar os destaques.");

      const produtos = await resposta.json();
      const porId = new Map(produtos.map((produto) => [produto.id, produto]));

      idsDestaque.forEach((id) => {
        const produto = porId.get(id);
        if (produto) carrossel.appendChild(criarCardDestaque(produto));
      });
    } catch (error) {
      carrossel.innerHTML = `<p class="carrinho-aviso">${error.message}</p>`;
    }
  }

  carregarDestaques();
</script>

<script src="account.js"></script>
<script src="swag-assistant.js"></script>
</body>
</html>

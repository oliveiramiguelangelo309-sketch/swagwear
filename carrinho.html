<!DOCTYPE html>
<!-- =============================================================================
     carrinho.html — página do carrinho de compras.
     O carrinho fica salvo no navegador (localStorage, chave "carrinho").
     Aqui dá para mudar quantidades, remover peças e seguir para o pagamento.
     ============================================================================= -->
<html lang="pt-BR">
<head>
  <!-- acentos e caracteres especiais em português -->
  <meta charset="UTF-8">
  <!-- faz a página se ajustar à largura do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- título da aba do navegador -->
  <title>Carrinho - SwagWear</title>
  <!-- estilo visual compartilhado por todas as páginas -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- barra de navegação; os links de conta são ajustados pelo account.js -->
  <header class="navbar">
    <h2>SWAGWEAR</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="cadastro.html">Conta</a>
    </nav>
  </header>

  <main class="carrinho-page">
    <!-- título da página -->
    <div class="carrinho-cabecalho">
      <p class="produto-tag">SEU CARRINHO</p>
      <h1>Peças escolhidas</h1>
      <p>Revise as quantidades antes de criar seu pedido.</p>
    </div>

    <div class="carrinho-layout">
      <!-- lista de peças: preenchida pelo JavaScript (aria-live avisa leitores de tela quando muda) -->
      <section id="listaCarrinho" class="carrinho-lista" aria-live="polite"></section>

      <!-- caixa lateral com o total e o botão de pagamento -->
      <aside class="carrinho-resumo">
        <h2>Resumo</h2>
        <div class="carrinho-total-linha">
          <span>Total exibido</span>
          <strong id="carrinhoTotal">R$ 0,00</strong>
        </div>

        <!-- segue para a página de pagamento -->
        <button id="btnFinalizarPedido" class="btn-provador" type="button">
          Ir para pagamento
        </button>

        <!-- link "Entrar", que só aparece se a pessoa tentar pagar sem estar logada -->
        <a id="entrarParaFinalizar" class="btn-provador-secundario" href="entrar.html" hidden>Entrar</a>

        <p class="carrinho-aviso">
          O backend recalcula os preços usando o banco. Nenhum dado de cartão é armazenado.
        </p>
        <!-- mensagens de aviso (ex.: "Entre na sua conta...") -->
        <p id="mensagemCarrinho" class="provador-mensagem" role="status"></p>
      </aside>
    </div>
  </main>

  <script>
    /* ================= DADOS DO CARRINHO ================= */

    /* Lê o carrinho salvo no navegador. Cada item tem: produto_id, nome, preco, imagem e quantidade.
       Se ainda não houver carrinho, começa com uma lista vazia. */
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    /* Partes da página que o script atualiza. */
    const listaCarrinho = document.getElementById("listaCarrinho");
    const carrinhoTotal = document.getElementById("carrinhoTotal");
    const mensagemCarrinho = document.getElementById("mensagemCarrinho");

    /* Salva o carrinho no navegador e redesenha a lista. */
    function salvarCarrinho() {
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      renderizarCarrinho();
    }

    /* Formata como dinheiro brasileiro: 149 -> "R$ 149,00". */
    function formatarPreco(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    /* ================= DESENHA O CARRINHO ================= */

    /* Desenha novamente os itens sempre que quantidade ou remoção mudar. */
    function renderizarCarrinho() {
      listaCarrinho.innerHTML = "";

      /* Carrinho vazio: mostra um aviso com link para a loja. */
      if (carrinho.length === 0) {
        listaCarrinho.innerHTML = `
          <div class="carrinho-vazio">
            <h2>Seu carrinho está vazio.</h2>
            <a class="btn-provador-secundario" href="loja.html">Explorar a loja</a>
          </div>`;
      }

      /* Um bloco para cada peça. "indice" é a posição da peça na lista,
         guardada nos botões (data-indice) para saber em qual peça clicaram. */
      carrinho.forEach((item, indice) => {
        const artigo = document.createElement("article");
        artigo.className = "carrinho-item";

        /* textContent abaixo evita interpretar nomes de produto como HTML. */
        artigo.innerHTML = `
          <img src="" alt="">
          <div class="carrinho-item-info">
            <h2></h2>
            <p>${formatarPreco(item.preco)}</p>
            <div class="carrinho-quantidade">
              <button type="button" data-acao="diminuir" data-indice="${indice}">−</button>
              <span>${item.quantidade}</span>
              <button type="button" data-acao="aumentar" data-indice="${indice}">＋</button>
            </div>
          </div>
          <button class="carrinho-remover" type="button" data-acao="remover" data-indice="${indice}">Remover</button>`;

        const imagem = artigo.querySelector("img");
        imagem.src = item.imagem || "";
        imagem.alt = item.nome || "Produto SwagWear";
        artigo.querySelector("h2").textContent = item.nome || "Produto SwagWear";
        listaCarrinho.appendChild(artigo);
      });

      /* Total só para exibir: preço x quantidade de cada peça.
         O valor que vale de verdade é recalculado pelo servidor ao criar o pedido. */
      const totalVisual = carrinho.reduce(
        (total, item) => total + Number(item.preco || 0) * Number(item.quantidade || 0),
        0
      );
      carrinhoTotal.textContent = formatarPreco(totalVisual);
    }

    /* ================= BOTÕES − / ＋ / REMOVER ================= */

    /* Um único listener atende todos os botões criados dinamicamente. */
    listaCarrinho.addEventListener("click", function (event) {
      /* Descobre se o clique foi num botão com data-acao (ou dentro dele). */
      const botao = event.target.closest("button[data-acao]");
      if (!botao) return;

      const indice = Number(botao.dataset.indice);
      const acao = botao.dataset.acao;

      if (acao === "aumentar") carrinho[indice].quantidade += 1;
      /* A quantidade nunca fica menor que 1; para tirar a peça, use "Remover". */
      if (acao === "diminuir" && carrinho[indice].quantidade > 1) carrinho[indice].quantidade -= 1;
      /* splice tira 1 item da lista na posição "indice". */
      if (acao === "remover") carrinho.splice(indice, 1);
      salvarCarrinho();
    });

    /* ================= IR PARA O PAGAMENTO ================= */

    document.getElementById("btnFinalizarPedido").addEventListener("click", function () {
      /* Só quem está logado pode fazer pedido. */
      const token = localStorage.getItem("swagwear_token");

      if (!token) {
        mensagemCarrinho.textContent = "Entre na sua conta para finalizar a compra.";
        document.getElementById("entrarParaFinalizar").hidden = false;
        return;
      }

      if (carrinho.length === 0) {
        mensagemCarrinho.textContent = "Adicione pelo menos uma peça ao carrinho.";
        return;
      }

      /* Produtos antigos sem id continuam no carrinho, mas precisam ser migrados antes do pedido. */
      if (carrinho.some((item) => !item.produto_id)) {
        mensagemCarrinho.textContent = "Uma peça antiga do carrinho não possui ID. Remova-a e adicione novamente pela loja.";
        return;
      }

      /* A página de pagamento fará o POST autenticado depois da confirmação visual. */
      window.location.href = "pagamento.html";
    });

    /* Desenha o carrinho assim que a página abre. */
    renderizarCarrinho();
  </script>
<!-- menu de conta na barra de navegação -->
<script src="account.js"></script>
<!-- chat da assistente Swag -->
<script src="swag-assistant.js"></script>
</body>
</html>

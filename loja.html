<!DOCTYPE html>
<!-- =============================================================================
     loja.html — página da Loja: mostra todas as camisetas, separadas por drop.
     Os cards são montados pelo JavaScript no final, com os dados de /api/produtos.
     ============================================================================= -->
<html lang="pt-BR">
<head>
  <!-- acentos e caracteres especiais em português -->
  <meta charset="UTF-8">
  <!-- título que aparece na aba do navegador -->
  <title>Loja - SwagWear</title>

  <!-- estilo visual compartilhado por todas as páginas -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- marcador do topo da página (destino do botão "Voltar ao topo") -->
  <div id="topo"></div>

  <!-- barra de navegação; os links de conta são ajustados pelo account.js -->
  <header class="navbar">
    <h2>SWAGWEAR</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="loja.html">Loja</a>
      <a href="cadastro.html">Conta</a>
    </nav>
  </header>

  <!-- faixa de abertura da loja: banner "Coleções SwagWear Corporation" -->
  <section class="hero-loja">
    <!-- o título já está desenhado no banner; este h1 fica escondido na tela,
         mas continua sendo lido por leitores de tela e pelo Google -->
    <h1 class="texto-escondido">Coleções SwagWear</h1>

    <img class="banner-loja" src="assets/colecoes-swagwear.jpg" alt="Coleções SwagWear Corporation: camisetas brancas estampadas sobre fundo azul com respingos de tinta">
  </section>

  <!-- aqui o JavaScript coloca uma seção para cada drop, com seus cards -->
  <div id="colecoesLoja"></div>

  <!-- botão flutuante que rola a página de volta ao topo -->
  <button id="topoBtn" class="btn-topo">
    ↑ Voltar ao topo
  </button>

  <script>
    /* ================= TEXTOS DE CADA DROP ================= */

    /* O nome do drop vem do banco (coluna "colecao"); aqui ficam a etiqueta e a descrição. */
    const colecoesInfo = {
      'Baby Tee': { tag: 'DROP 01', texto: 'Baby tees de corte ajustado, com estampas coloridas.' },
      'Corporation': { tag: 'DROP 02', texto: 'Camisetas de corte reto da linha SwagWear Corporation, das básicas às estampadas.' }
    };

    /* ================= FUNÇÕES DE APOIO ================= */

    /* Formata o preço no padrão brasileiro: 149 -> "R$ 149". */
    function formatarPreco(valor) {
      return `R$ ${Number(valor || 0).toLocaleString("pt-BR")}`;
    }

    /* Texto pequeno acima do nome no card ("Calça" para parte de baixo, "Blusa" para o resto). */
    function categoriaVisivel(produto) {
      return produto.categoria === 'parte_inferior' ? 'Calça' : 'Blusa';
    }

    /* Cria o card de uma camiseta: foto, categoria, nome, preço e botão "Ver mais". */
    function criarCard(produto) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="" alt="">
        <div class="info">
          <span class="categoria"></span>
          <h3></h3>
          <p></p>
          <a class="btn-card" href="produto.html?produto=${encodeURIComponent(produto.id)}">Ver mais</a>
        </div>`;

      /* Os dados entram com textContent/src, nunca dentro do innerHTML,
         para um texto do banco nunca virar código HTML na página. */
      const imagem = card.querySelector("img");
      imagem.src = produto.imagem || "";
      imagem.alt = produto.nome || "Produto SwagWear";
      card.querySelector(".categoria").textContent = categoriaVisivel(produto);
      card.querySelector("h3").textContent = produto.nome;
      card.querySelector(".info p").textContent = formatarPreco(produto.preco);
      return card;
    }

    /* ================= MONTA A LOJA ================= */

    /* Busca as camisetas na API, agrupa por drop e cria uma seção para cada drop. */
    async function carregarLoja() {
      const destino = document.getElementById("colecoesLoja");

      try {
        const resposta = await fetch("/api/produtos");
        if (!resposta.ok) throw new Error("Não foi possível carregar os produtos.");

        const produtos = await resposta.json();

        /* Map: nome do drop -> lista de camisetas daquele drop (na ordem em que chegam). */
        const porColecao = new Map();

        produtos.forEach((produto) => {
          const nomeColecao = produto.colecao || "SwagWear";
          if (!porColecao.has(nomeColecao)) porColecao.set(nomeColecao, []);
          porColecao.get(nomeColecao).push(produto);
        });

        /* Limpa a área antes de desenhar. */
        destino.innerHTML = "";

        porColecao.forEach((itensColecao, nomeColecao) => {
          /* Drop sem texto cadastrado em colecoesInfo fica com etiqueta e descrição vazias. */
          const info = colecoesInfo[nomeColecao] || { tag: "", texto: "" };

          /* Seção do drop: cabeçalho (etiqueta, nome, descrição) + grade de cards. */
          const secao = document.createElement("section");
          secao.className = "colecao";
          secao.innerHTML = `
            <div class="colecao-topo">
              <p class="tag-colecao"></p>
              <h2></h2>
              <p></p>
            </div>
            <div class="grid-loja"></div>`;

          secao.querySelector(".tag-colecao").textContent = info.tag;
          secao.querySelector("h2").textContent = nomeColecao;
          secao.querySelector(".colecao-topo > p:last-child").textContent = info.texto;

          /* Coloca um card para cada camiseta do drop. */
          const grid = secao.querySelector(".grid-loja");
          itensColecao.forEach((produto) => grid.appendChild(criarCard(produto)));

          destino.appendChild(secao);
        });
      } catch (error) {
        /* Se a API falhar, mostra o aviso no lugar dos cards. */
        destino.innerHTML = `<p class="carrinho-aviso">${error.message}</p>`;
      }
    }

    /* Começa a carregar assim que a página abre. */
    carregarLoja();

    /* ================= BOTÃO "VOLTAR AO TOPO" ================= */

    const topoBtn = document.getElementById("topoBtn");
    let subindo = false; /* true enquanto a animação de subida estiver acontecendo */
    let scrollTimer = null; /* guarda o próximo passo da animação, para poder cancelar */

    topoBtn.addEventListener("click", function () {
      if (subindo) return; /* evita começar duas animações ao mesmo tempo */
      subindo = true;
      subirSuave();
    });

    /* Sobe a página aos poucos: cada passo anda 1/18 da distância que falta (mínimo 10px),
       a cada 15 milissegundos, o que dá um efeito de desaceleração no final. */
    function subirSuave() {
      const atual = window.scrollY;

      /* Chegou no topo: termina a animação. */
      if (atual <= 0) {
        window.scrollTo(0, 0);
        subindo = false;
        scrollTimer = null;
        return;
      }

      const passo = Math.max(10, atual / 18);
      window.scrollTo(0, atual - passo);
      scrollTimer = setTimeout(subirSuave, 15);
    }

    /* Se a pessoa usar a rodinha do mouse durante a subida, cancela a animação. */
    window.addEventListener("wheel", function () {
      if (subindo) {
        clearTimeout(scrollTimer);
        subindo = false;
        scrollTimer = null;
      }
    });

    /* No celular, tocar na tela também cancela a animação. */
    window.addEventListener("touchstart", function () {
      if (subindo) {
        clearTimeout(scrollTimer);
        subindo = false;
        scrollTimer = null;
      }
    });
  </script>

  <!-- menu de conta na barra de navegação -->
  <script src="account.js"></script>
  <!-- chat da assistente Swag -->
  <script src="swag-assistant.js"></script>
</body>

</html>
